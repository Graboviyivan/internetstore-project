<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Montserrat:wght@435&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>

  <body>
    <header>
      <div class="container">
        <div class="logo2">
          <img src="img/logo.JPG" />
        </div>
        <nav class="nav">
          <a href="" class="nav__item">Про нас</a>
          <button id="pay-btn" href="" class="nav__item">Оплата і доставка</button>
          <a href="" class="nav__item">Контакти</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <h1 class="hero__title">Ніжних обіймів <br />з перших днів</h1>
          <button class="hero__btn">
            <a href="" class="hero__btn__link">Дізнатися більше</a>
          </button>
        </div>
      </section>
      <section class="store">
        <div class="container">
          <ul class="store__list">
            <li class="store__item">
              <img class="store__item__img" src="img/plushbear.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Іграшки</button>
              </a>
            </li>

            <li class="store__item">
              <img class="store__item__img" src="img/clothes.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Дитячий одяг</button>
              </a>
            </li>

            <li class="store__item">
              <img class="store__item__img" src="img/forbaby.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Для малюків</button>
              </a>
            </li>

            <li class="store__item">
              <img class="store__item__img" src="img/bag.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Матусям</button>
              </a>
            </li>

            <li class="store__item">
              <img
                class="store__item__img"
                src="img/5287746732072569839_120.png"
              />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Прогулянки</button>
              </a>
            </li>

            <li class="store__item">
              <img class="store__item__img" src="img/bath.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Купання</button>
              </a>
            </li>

            <li class="store__item">
              <img class="store__item__img" src="img/dishes.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Годування</button>
              </a>
            </li>

            <li class="store__item">
              <img class="store__item__img" src="img/childrenbed.png" />
              <a class="store__item__link" href="">
                <button class="store__item__link__btn">Дитяча кімната</button>
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <ul class="footer__list">
          <li class="footer__item">
            <p>Графік роботи:</p>
            <p>Пн-Нд 09.00-19.00</p>
            <p><span class="footer__span">Телефон:096-12-19-444</span></p>
          </li>
          <li class="footer__item">
            <a
              href="https://www.instagram.com/splusha.com.ua/?igsh=NTRocW50Mmo0c21o&utm_source=qr#"
              target="_blank"
            >
              <img class="logo3" src="img/logo2.png" />
            </a>
          </li>
          <li class="footer__item">
            <nav>Бренди</nav>
            <nav>Акції</nav>
            <nav>Повернення та обмін</nav>
          </li>
          <li class="footer__item">
            <img class="instagram" src="img/instagram.png" />
          </li>
        </ul>
      </div>
    </footer>

    <div class="backdrop"></div>
    <div class="pay">
      <form class="pay__form" action="">
        <label class="pay__label" for="">
          Ваше ім'я
          <input class="pay__input" type="text">
        </label>
        <label class="pay__label" for="">
          Ваше прізвище
          <input class="pay__input" type="text">
        </label>
        <label class="pay__label" for="">
          Ваш номер телефону
          <input class="pay__input" type="text">
        </label>

        <button class="store__item__link__btn pay__form__btn">Відправити</button>
      </form>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
